<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Elite Feet Season Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">

<script id="state" type="application/json">{"v":2}</script>

<style>
:root{
  --ground:#F1F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#EDF1F5;
  --line:#DEE4EA; --line-strong:#C6CED8;
  --ink:#12161C; --ink-2:#525B67; --ink-3:#838C98;
  --accent:#0078BF; --accent-ink:#FFFFFF; --accent-soft:#E2F0F9;
  --c-class:#0078BF; --c-class-soft:#E2F0F9;
  --c-company:#D02A38; --c-company-soft:#FCE7E8;
  --c-private:#D9701C; --c-private-soft:#FDEEE0;
  --c-office:#2E8F3C; --c-office-soft:#E4F4E6;
  --c-camp:#7A4FBF; --c-camp-soft:#EFE8FA;
  --c-comp:#0E7C86; --c-comp-soft:#DFF1F3;
  --c-other:#98A2AE; --c-other-soft:#EEF1F4;
  --warn:#B4530E; --warn-soft:#FBEDDF; --warn-line:#E8B588;
  --shadow:0 1px 2px rgba(18,22,28,.06), 0 8px 24px -12px rgba(18,22,28,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --surface:#171B22; --surface-2:#1D222A; --surface-3:#232933;
    --line:#2A313B; --line-strong:#3A424E;
    --ink:#EDF1F6; --ink-2:#A4AEBB; --ink-3:#78828F;
    --accent:#46A8E8; --accent-ink:#06202F; --accent-soft:#132A3A;
    --c-class:#46A8E8; --c-class-soft:#13293A;
    --c-company:#F26A73; --c-company-soft:#331A1E;
    --c-private:#F0994A; --c-private-soft:#332414;
    --c-office:#5CC169; --c-office-soft:#16301B;
    --c-camp:#A98BE0; --c-camp-soft:#241D33;
    --c-comp:#4FC2CE; --c-comp-soft:#102E31;
    --c-other:#7C8794; --c-other-soft:#20262E;
    --warn:#E8AC69; --warn-soft:#2E2416; --warn-line:#5C4526;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#171B22; --surface-2:#1D222A; --surface-3:#232933;
  --line:#2A313B; --line-strong:#3A424E;
  --ink:#EDF1F6; --ink-2:#A4AEBB; --ink-3:#78828F;
  --accent:#46A8E8; --accent-ink:#06202F; --accent-soft:#132A3A;
  --c-class:#46A8E8; --c-class-soft:#13293A;
  --c-company:#F26A73; --c-company-soft:#331A1E;
  --c-private:#F0994A; --c-private-soft:#332414;
  --c-office:#5CC169; --c-office-soft:#16301B;
  --c-camp:#A98BE0; --c-camp-soft:#241D33;
  --c-comp:#4FC2CE; --c-comp-soft:#102E31;
  --c-other:#7C8794; --c-other-soft:#20262E;
  --warn:#E8AC69; --warn-soft:#2E2416; --warn-line:#5C4526;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:Archivo,"Public Sans",sans-serif;margin:0;text-wrap:balance}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 1px var(--line)}
.brand-mark img{width:100%;height:100%;display:block}
.brand-eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brand-name{font-family:Archivo;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.topbar-spacer{flex:1}
.period-chip{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 14px}
.period-chip .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.period-chip .val{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.chip-div{width:1px;align-self:stretch;background:var(--line)}

.due{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--warn-soft);border:1px solid var(--warn-line);border-left:4px solid var(--warn);
  border-radius:var(--radius);padding:12px 16px;margin:18px 0 0;
}
.due.is-clear{background:var(--c-office-soft);border-color:var(--c-office);border-left-color:var(--c-office)}
.due-k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--warn)}
.due.is-clear .due-k{color:var(--c-office)}
.due-t{font-weight:600;font-size:14.5px;line-height:1.35}
.due-amt{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:21px;letter-spacing:-.02em}
.due-sub{font-size:11.5px;color:var(--ink-3)}

.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 14px}
.tabs{display:flex;background:var(--surface-3);border-radius:var(--radius);padding:3px;gap:2px}
.tab{border:0;background:transparent;padding:7px 15px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav{display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.btn:hover{border-color:var(--line-strong);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06);color:var(--accent-ink)}
.range-title{font-family:Archivo;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.sec-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

.ev{display:flex;gap:10px;align-items:flex-start;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 12px;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
.ev-main{min-width:0;flex:1}
.ev-time{font-family:"IBM Plex Mono";font-size:11px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev-title{font-weight:600;font-size:13.5px;line-height:1.3;margin-top:1px}
.ev-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.ev-pay{font-family:"IBM Plex Mono";font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--k);white-space:nowrap}
.ev.is-other{background:var(--surface-2);border-style:dashed}
.ev.is-other .ev-title{color:var(--ink-2);font-weight:500}
.ev.is-cancelled{opacity:.45}
.ev.is-cancelled .ev-title{text-decoration:line-through}
.ev-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11px;font-weight:600;padding:3px 8px;color:var(--ink-2)}
.mini:hover{border-color:var(--line-strong);color:var(--ink)}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mini.danger:hover{color:var(--c-company);border-color:var(--c-company)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--k);flex:none}

.warn-banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--warn)}

.day-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:860px){.day-grid{grid-template-columns:1fr}}
.day-head{padding:16px 18px;border-bottom:1px solid var(--line)}
.day-dow{font-family:Archivo;font-size:22px;font-weight:800;letter-spacing:-.02em}
.day-date{font-size:13px;color:var(--ink-3);margin-top:1px}
.day-list{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.day-list .ev{padding:11px 12px 11px 15px}
.day-list .ev-title{font-size:15px}
.day-list .ev-time{font-size:12px}
.summary{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stat-row .k{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.stat-row .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.stat-total{border-top:1px solid var(--line);padding-top:12px}
.stat-total .k{font-weight:700;color:var(--ink);font-size:14px}
.stat-total .v{font-size:20px;font-weight:600}

.week-scroll{overflow-x:auto;padding-bottom:4px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(146px,1fr));gap:10px;min-width:1082px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.wcol.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wcol-head{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;cursor:pointer}
.wcol-dow{font-family:Archivo;font-weight:700;font-size:12px;letter-spacing:.02em}
.wcol-num{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wcol-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:56px}
.wcol-foot{padding:7px 11px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius);display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:11.5px;font-variant-numeric:tabular-nums}
.wcol-foot .h{color:var(--ink-3)}
.wcol-foot .m{font-weight:600}
.wempty{font-size:11.5px;color:var(--ink-3);padding:6px 2px;font-style:italic}
.week-total{margin-top:12px;display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;padding:14px 18px}
.wt-item .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.wt-item .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:19px;margin-top:2px}

.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mdow{background:var(--surface-2);padding:7px 9px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-3);text-align:center}
.mcell{background:var(--surface);min-height:104px;padding:7px 8px;display:flex;flex-direction:column;gap:5px;text-align:left;border:0;border-radius:0}
.mcell:hover{background:var(--surface-2)}
.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mcell.is-out{background:var(--surface-2);opacity:.5}
.mcell.is-today .mnum{background:var(--accent);color:var(--accent-ink)}
.mcell.is-due{box-shadow:inset 0 -3px 0 var(--warn)}
.mcell-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mnum{font-family:"IBM Plex Mono";font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;width:21px;height:21px;display:grid;place-items:center;border-radius:50%}
.mpay{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mdots{display:flex;flex-wrap:wrap;gap:3px}
.mchip{font-size:10px;font-weight:600;border-radius:4px;padding:1px 5px;background:var(--k-soft);color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mdot-only{width:6px;height:6px;border-radius:50%;background:var(--k);display:none}
.mflag{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--warn);text-transform:uppercase}
@media(max-width:720px){
  .mcell{min-height:74px}
  .mchip{display:none}
  .mdot-only{display:block}
  .mdots{gap:4px}
}

.pay-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.ph{background:var(--surface);padding:15px 17px}
.ph .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.ph .v{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:24px;margin-top:4px;letter-spacing:-.02em}
.ph .s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.pp{margin-bottom:10px;overflow:hidden}
.pp-head{display:flex;align-items:center;gap:14px;padding:13px 17px;width:100%;background:transparent;border:0;text-align:left}
.pp-head:hover{background:var(--surface-2)}
.pp-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pp-idx{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:none}
.pp-when{flex:1;min-width:0}
.pp-when .r{font-weight:600;font-size:14px}
.pp-when .s{font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.pp-amt{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.pp.is-current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pp.is-late{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.pp-body{border-top:1px solid var(--line);padding:14px 17px;background:var(--surface-2)}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
.ptable td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.ptable .r{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap}
.ptable tfoot td{font-weight:700;border-top:2px solid var(--line-strong);border-bottom:0;padding-top:9px}
.ptable tr.sub td{background:var(--surface-3);font-weight:700}
.ptable tr.off td{color:var(--ink-3)}
.flag{border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.flag-sub{background:var(--c-class-soft);color:var(--c-class)}
.flag-paid{background:var(--c-office-soft);color:var(--c-office)}
.flag-late{background:var(--warn-soft);color:var(--warn)}

/* timesheet preview */
.ts-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 12px;background:var(--k-soft);color:var(--k);border-radius:8px;font-size:12px;line-height:1.45}
.ts-note .dot{margin-top:5px}
.ts-wrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.ts-sum{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:7px}
.ts-sum::-webkit-details-marker{display:none}
.ts-sum::before{content:"▸";font-size:11px;color:var(--ink-3)}
.ts-wrap[open] .ts-sum::before{content:"▾"}
.ts-sum:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ts-scroll{overflow-x:auto;margin-top:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.ts{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
table.ts th,table.ts td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;white-space:nowrap}
table.ts th{background:var(--surface-2);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;text-align:center;line-height:1.25}
table.ts th span{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-2);letter-spacing:0}
.ts-name{text-align:left;position:sticky;left:0;background:var(--surface);min-width:190px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
table.ts th.ts-name{background:var(--surface-2);text-align:left}
.ts-d{text-align:center;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;width:42px}
.ts-wk{background:var(--surface-2)}
.ts-tot{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-3);border-right:0}
table.ts tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
table.ts tr.ts-office td{border-top:2px solid var(--line-strong)}
table.ts tbody tr:hover .ts-name,table.ts tbody tr:hover td{background:var(--accent-soft)}

/* competition planner */
.cp{margin-bottom:10px;overflow:hidden}
.cp.is-open{border-color:var(--c-comp);box-shadow:0 0 0 1px var(--c-comp)}
.cp-head{display:flex;align-items:center;gap:18px;padding:14px 17px;width:100%;background:transparent;border:0;text-align:left}
.cp-head:hover{background:var(--surface-2)}
.cp-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cp-when{flex:1;min-width:0}
.cp-name{font-family:Archivo;font-weight:800;font-size:17px;letter-spacing:-.01em}
.cp-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.cp-status{text-align:right;flex:none}
.cp-count{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.cp-count.is-done{color:var(--c-office)}
.cp-sub{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:1px}
.cp-body{border-top:1px solid var(--line);padding:15px 17px;background:var(--surface-2)}
.cp-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.cp-tbl{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
table.cp-tbl th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
table.cp-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cp-tbl tr:last-child td{border-bottom:0}
table.cp-tbl tr.is-skipped{opacity:.4}
.cp-r{min-width:210px}
.cp-title{font-weight:600;font-size:13.5px;line-height:1.3}
.cp-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--k);margin-top:3px}
.cp-in{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;width:100%;min-width:110px}
.cp-in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.cp-in:disabled{opacity:.5}
.cp-order{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.cp-day{margin-top:11px}
.cp-dayname{font-family:Archivo;font-weight:700;font-size:13px;margin-bottom:6px}
.cp-slot{display:flex;align-items:baseline;gap:10px;padding:7px 11px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:7px;margin-bottom:5px}
.cp-time{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;min-width:62px}
.cp-slotname{font-weight:600;font-size:13.5px;flex:1}
.cp-slotnote{font-size:11.5px;color:var(--ink-3)}
@media(max-width:560px){
  .tabs{flex-wrap:wrap}
  .tab{padding:7px 11px;font-size:13px}
  .period-chip{flex-wrap:wrap;row-gap:9px;column-gap:18px;width:100%}
  .period-chip .chip-div{display:none}
  .brand-mark{width:40px;height:40px}
  .cp-head{flex-wrap:wrap;gap:10px 14px}
  .cp-when{flex:1 1 100%}
  .cp-status{text-align:left}
  .cp-r{min-width:160px}
  .cp-slot{flex-wrap:wrap}
  .cp-slotname{flex:1 1 auto}
}

.modal-scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:80;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100vh - 40px);overflow-y:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.hint{font-size:11.5px;color:var(--ink-3)}
.plist{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:11px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.prow .pn{flex:1;min-width:0}
.prow .pn b{font-size:13.5px;font-weight:600}
.prow .pn div{font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-size:16px;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:13.5px;margin:0 0 14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2);padding:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.save-note{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:90;background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .save-note{animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
.foot{padding:26px 0 0;font-size:11.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
</style>

const CRC_TABLE=(function(){const t=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}
  return t;})();
function crc32(b){let c=-1;for(let i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8);return (c^-1)>>>0;}
function b64bytes(s){const bin=atob(s),o=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o;}
function utf8(s){return new TextEncoder().encode(s);}

/* minimal zip writer, stored (method 0) entries only */
function zipStore(files){
  const now=new Date();
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const locals=[],centrals=[]; let offset=0;
  files.forEach(function(f){
    const name=utf8(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosTime,true); lv.setUint16(12,dosDate,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true); lh.set(name,30);
    locals.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true);
    cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true); ch.set(name,46);
    centrals.push(ch);
    offset += lh.length + data.length;
  });
  let cdSize=0; centrals.forEach(function(c){ cdSize+=c.length; });
  const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true); ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  let total=offset+cdSize+22, pos=0;
  const out=new Uint8Array(total);
  locals.forEach(function(p){ out.set(p,pos); pos+=p.length; });
  centrals.forEach(function(p){ out.set(p,pos); pos+=p.length; });
  out.set(eocd,pos);
  return out;
}

function xmlEsc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]; }); }
function setCell(xml, ref, value, isText){
  const re=new RegExp('<c r="'+ref+'"( s="\\d+")?/>');
  if(value===null||value===undefined||value==="") return xml;
  return xml.replace(re, function(_,s){
    s=s||"";
    return isText
      ? '<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(value)+'</t></is></c>'
      : '<c r="'+ref+'"'+s+'><v>'+value+'</v></c>';
  });
}
function excelSerial(d){
  return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000);
}

/* one row per class, hours spread across the 14 day columns; office kept separate */
function timesheetData(i){
  const r=periodRange(i), days=[];
  for(let k=0;k<14;k++) days.push(addDays(r.start,k));
  const seen={}, rows=[], office=new Array(14).fill(0);
  days.forEach(function(d,idx){
    mineOn(d).forEach(function(e){
      if(e.cancelled || !e.onSheet) return;      /* privates + choreo never appear here */
      if(e.kind==="comp") return;                /* flat fee — described in the comments box, not the grid */
      const hrs=e.minutes/60;
      if(e.kind==="office"){ office[idx]+=hrs; return; }
      let row=seen[e.title];
      if(!row){ row=seen[e.title]={title:e.title, hours:new Array(14).fill(0)}; rows.push(row); }
      row.hours[idx]+=hrs;
    });
  });
  /* flat-fee competitions carry no hours, so they are described in the comments box */
  const comps=[];
  days.forEach(function(day){
    mineOn(day).forEach(function(e){
      if(e.kind==="comp" && !e.cancelled && e.pay>0)
        comps.push({name:e.title, venue:e.room, fee:e.pay});
    });
  });
  let overflow=null;
  const cap=TS.lastRow-TS.firstRow+1;
  if(rows.length>cap){
    const extra=rows.splice(cap-1);
    overflow=extra.map(function(x){ return x.title; });
    const merged={title:"Other classes — see comments", hours:new Array(14).fill(0)};
    extra.forEach(function(x){ x.hours.forEach(function(v,k){ merged.hours[k]+=v; }); });
    rows.push(merged);
  }
  const classTotal=rows.reduce(function(a,x){ return a+x.hours.reduce(function(p,q){return p+q;},0); },0);
  const officeTotal=office.reduce(function(a,b){return a+b;},0);
  const compTotal=comps.reduce(function(a,c){ return a+c.fee; },0);
  return {i:i, range:r, days:days, rows:rows, office:office, overflow:overflow, comps:comps,
          classTotal:classTotal, officeTotal:officeTotal, compTotal:compTotal,
          total:classTotal+officeTotal};
}

function buildTimesheet(i){
  const d=timesheetData(i);
  let sheet=new TextDecoder().decode(b64bytes(TPL["xl/worksheets/sheet1.xml"]));
  sheet=setCell(sheet,"O2",excelSerial(d.range.due),false);
  d.rows.forEach(function(row,n){
    const r=TS.firstRow+n;
    sheet=setCell(sheet,"A"+r,row.title,true);
    row.hours.forEach(function(h,k){
      if(h>0) sheet=setCell(sheet,COLS14[k]+r,round2(h),false);
    });
  });
  d.office.forEach(function(h,k){
    if(h>0) sheet=setCell(sheet,COLS14[k]+TS.officeRow,round2(h),false);
  });
  if(d.comps.length){
    const note=d.comps.map(function(c){
      return c.name+" Competition"+(c.venue?" — "+c.venue:"")+": flat fee $"+round2(c.fee);
    }).join("   |   ");
    sheet=setCell(sheet,TS.commentCell,note,true);
  }
  const files=Object.keys(TPL).map(function(name){
    return {name:name, data: name==="xl/worksheets/sheet1.xml" ? utf8(sheet) : b64bytes(TPL[name])};
  });
  return {bytes:zipStore(files), data:d};
}

function downloadTimesheet(i){
  let out;
  try{ out=buildTimesheet(i); }
  catch(err){ toast("Couldn't build the timesheet"); return; }
  const r=out.data.range.due;
  const name="Chichester "+r.getFullYear()+"-"+String(r.getMonth()+1).padStart(2,"0")
    +"-"+String(r.getDate()).padStart(2,"0")+".xlsx";
  const blob=new Blob([out.bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
  toast("Saved "+name);
}

function load(){
  let raw = {};
  try{ raw = JSON.parse(document.getElementById("state").textContent) || {}; }catch(e){}
  if(!raw.settings){ try{ const ls=localStorage.getItem("ef-ledger"); if(ls) raw=JSON.parse(ls); }catch(e){} }
  const st = Object.assign({}, DEFAULTS, raw);
  st.settings = Object.assign({}, DEFAULTS.settings, raw.settings || {});
  st.privates = raw.privates || []; st.overrides = raw.overrides || {};
  st.claims = raw.claims || {}; st.submitted = raw.submitted || {}; st.paid = raw.paid || {};
  st.planner = raw.planner || {};
  /* add the standing lessons once, so existing saved data isn't overwritten and
     a deleted lesson doesn't reappear on the next load */
  if(!st.seeded){
    SEED_PRIVATES.forEach(function(p){
      if(!st.privates.some(function(x){ return x.id===p.id; })) st.privates.push(p);
    });
    st.seeded = true;
  }
  return st;
}

/* ---------- dates ---------- */
const DOW_LONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ return addDays(d,-((d.getDay()+6)%7)); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function nthOfMonth(d){ return Math.floor((d.getDate()-1)/7)+1; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function sameDay(a,b){ return ymd(a)===ymd(b); }
function mins(t){ const p=t.split(":").map(Number); return p[0]*60+p[1]; }
function fmtTime(t){ const p=t.split(":").map(Number),h=p[0],m=p[1];
  return (h%12===0?12:h%12)+(m?":"+String(m).padStart(2,"0"):"")+(h>=12?"pm":"am"); }
function fmtRange(s,e){ const a=fmtTime(s),b=fmtTime(e);
  return (a.slice(-2)===b.slice(-2)?a.slice(0,-2):a)+"–"+b; }
function fmtHours(m){ return (Math.round(m/60*100)/100).toString()+"h"; }
function money(n){ return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ return "$"+n.toLocaleString("en-US",{minimumFractionDigits:Math.abs(n%1)>0?2:0,maximumFractionDigits:2}); }
function fmtDate(d){ return MON_SHORT[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }
function fmtShort(d){ return MON_SHORT[d.getMonth()]+" "+d.getDate(); }

/* ---------- events ---------- */
function ledgerEnd(){ return fromYmd(STATE.settings.ledgerEnd || STATE.settings.seasonEnd); }
function inLedger(d){ return d>=fromYmd(STATE.settings.ledgerStart) && d<=ledgerEnd(); }
function inRegularSeason(d){ return d>=fromYmd(STATE.settings.seasonStart) && d<=fromYmd(STATE.settings.seasonEnd); }
function rateFor(k){ const s=STATE.settings;
  return k==="private" ? (Number(s.ratePrivate)||65) : k==="office" ? (Number(s.rateOffice)||40) : (Number(s.rateClass)||40); }

function mk(id,date,s,e,title,kind,mine,wth,by,group,room){
  return {id:id,date:date,s:s,e:e,minutes:mins(e)-mins(s),title:title,kind:kind,
          mine:!!mine,with:wth||null,by:by||null,group:group||null,room:room||null,cancelled:false,pay:0};
}
function endFrom(start,minutes){ const t=mins(start)+Number(minutes);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }

/* does a standing private lesson land on this date? */
function privateFalls(p,d){
  if(!p.recurring) return p.date===ymd(d);
  const from=p.from?fromYmd(p.from):fromYmd(STATE.settings.ledgerStart);
  const until=p.until?fromYmd(p.until):fromYmd(STATE.settings.seasonEnd);
  if(Number(p.dow)!==d.getDay() || d<from || d>until) return false;
  return !p.nths || !p.nths.length || p.nths.indexOf(nthOfMonth(d))>=0;
}
let FIRST_CACHE={};
function firstLessonOf(p){
  const k=p.id+"|"+p.recurring+"|"+p.dow+"|"+(p.nths||[]).join()+"|"+p.from+"|"+p.until+"|"+p.date;
  if(k in FIRST_CACHE) return FIRST_CACHE[k];
  let out=null;
  if(!p.recurring) out=p.date||null;
  else{
    let d=p.from?fromYmd(p.from):fromYmd(STATE.settings.ledgerStart);
    const until=p.until?fromYmd(p.until):fromYmd(STATE.settings.seasonEnd);
    for(let i=0;i<400 && d<=until;i++,d=addDays(d,1)){
      if(privateFalls(p,d)){ out=ymd(d); break; }
    }
  }
  return (FIRST_CACHE[k]=out);
}

function eventsOn(d){
  const key=ymd(d), out=[];
  if(!inLedger(d)) return out;
  const dow=d.getDay(), nth=nthOfMonth(d);

  (PRE_BY_DATE[key]||[]).forEach(function(b){
    out.push(mk("ps:"+b.id, key, b.s, b.e, b.t, "camp", b.mine, null, b.by||null, "Pre-season camp", b.room));
  });

  if(inRegularSeason(d)){
    WEEKLY.forEach(function(w){ if(w.dow===dow)
      out.push(mk("t:"+w.id+":"+key, key, w.s, w.e, w.t, w.k, w.mine, w.with, w.by, null, null)); });
    ROTATIONS.forEach(function(r){
      if(r.dow!==dow || r.nth.indexOf(nth)<0) return;
      r.blocks.forEach(function(b){
        out.push(mk("r:"+b.id+":"+key, key, b.s, b.e, b.t, "company", b.mine, b.with, b.by, r.name, null)); });
    });
  }

  COMPETITIONS.forEach(function(cp){
    const a=fromYmd(cp.from), b=fromYmd(cp.to);
    if(d<a || d>b) return;
    const ev=mk("cmp:"+cp.id+":"+key, key, "00:00", "00:00", cp.name, "comp", true, null, null, null, cp.venue);
    ev.amount = (ymd(b)===key) ? (Number(STATE.settings.compFee)||250) : 0;  /* fee books on the closing day */
    ev.allDay=true; ev.dayNo=daysBetween(a,d)+1; ev.dayCount=daysBetween(a,b)+1; ev.compId=cp.id;
    out.push(ev);
  });

  STATE.privates.forEach(function(p){
    if(privateFalls(p,d)){
      const ev=mk("p:"+p.id+":"+key,key,p.start,endFrom(p.start,p.minutes),p.student||"Private lesson","private",true,null,null,null,null);
      ev.pid=p.id; out.push(ev);
    }
    /* the choreography fee is charged once, on the first lesson of the series */
    const fee=Number(p.choreo)||0;
    if(fee>0 && firstLessonOf(p)===key){
      const ev=mk("f:"+p.id,key,p.start,p.start,"Choreography — "+(p.student||"Private"),"fee",true,null,null,null,null);
      ev.pid=p.id; ev.amount=fee; ev.note="once for the year"; out.push(ev);
    }
  });

  out.forEach(function(ev){
    ev.cancelled = !!(STATE.overrides[ev.id]||{}).cancelled;
    if(STATE.claims[ev.id]) ev.mine=true;
    ev.pay = (ev.mine && !ev.cancelled)
      ? (ev.amount!=null ? ev.amount : (ev.minutes/60)*rateFor(ev.kind))
      : 0;
    ev.onSheet = ON_TIMESHEET[ev.kind] !== false;
  });
  /* at the same start time, the lesson comes first and its one-time fee follows */
  out.sort(function(a,b){ return mins(a.s)-mins(b.s)
    || (a.kind==="fee"?1:0)-(b.kind==="fee"?1:0)
    || a.title.localeCompare(b.title); });
  return out;
}
function mineOn(d){ return eventsOn(d).filter(function(e){ return e.mine; }); }

function totalsFor(dates){
  const t={minutes:0,pay:0,count:0,byKind:{},sheetMinutes:0,sheetPay:0,privPay:0,privMinutes:0,
           compPay:0,compCount:0,studioPay:0};
  dates.forEach(function(d){
    mineOn(d).forEach(function(e){
      if(e.cancelled) return;
      t.minutes+=e.minutes; t.pay+=e.pay; t.count++;
      if(e.kind==="comp"){ t.compPay+=e.pay; if(e.pay>0) t.compCount++; }
      else if(e.onSheet){ t.sheetMinutes+=e.minutes; t.sheetPay+=e.pay; }
      else { t.privMinutes+=e.minutes; t.privPay+=e.pay; }
      const b=t.byKind[e.kind]||(t.byKind[e.kind]={minutes:0,pay:0,count:0});
      b.minutes+=e.minutes; b.pay+=e.pay; b.count++;
    });
  });
  t.studioPay = t.sheetPay + t.compPay;   /* what the studio pays: hourly work plus flat fees */
  return t;
}
function conflictsOn(d){
  const ev=mineOn(d).filter(function(e){ return !e.cancelled && !e.allDay && e.kind!=="fee"; }), out=[];
  for(let i=0;i<ev.length;i++) for(let j=i+1;j<ev.length;j++)
    if(mins(ev[i].s)<mins(ev[j].e) && mins(ev[j].s)<mins(ev[i].e)) out.push([ev[i],ev[j]]);
  return out;
}

/* ---------- pay periods: 14 days, each ending on a timesheet Sunday ---------- */
function periodCount(){
  const a=fromYmd(STATE.settings.ledgerStart), b=ledgerEnd();
  return Math.max(1, Math.ceil((daysBetween(a,b)+1)/14));
}
function periodRange(i){
  const s=addDays(fromYmd(STATE.settings.ledgerStart), i*14), due=addDays(s,13);
  const last=ledgerEnd();
  /* the deadline is always the 14th day; the worked range stops at the end of the ledger */
  return {start:s, end: due>last ? last : due, due:due};
}
function periodIndexFor(d){
  const n=Math.floor(daysBetween(fromYmd(STATE.settings.ledgerStart), d)/14);
  return Math.min(Math.max(n,0), periodCount()-1);
}
function currentPeriodIndex(){
  const t=today(), a=fromYmd(STATE.settings.ledgerStart);
  return t<a ? 0 : periodIndexFor(t);
}
function datesIn(s,e){ const o=[]; let d=s; while(d<=e){ o.push(d); d=addDays(d,1); } return o; }
function periodTotals(i){ const r=periodRange(i); return totalsFor(datesIn(r.start,r.end)); }

/* the timesheet that needs attention: earliest unsubmitted period that has ended or ends soon */
function nextDue(){
  const t=today(), n=periodCount();
  for(let i=0;i<n;i++){
    if(STATE.submitted[i]) continue;
    const r=periodRange(i);
    const days=daysBetween(t,r.due);
    if(days<=6) return {i:i, r:r, days:days, tot:periodTotals(i), late:days<0};
  }
  return null;
}
function isDueDate(d){
  const a=fromYmd(STATE.settings.ledgerStart);
  const diff=daysBetween(a,d);
  return diff>=0 && diff%14===13;
}

/* ---------- persistence ---------- */
function buildDoc(){
  const c=document.documentElement.cloneNode(true);
  const app=c.querySelector("#app"); if(app) app.innerHTML="";
  const st=c.querySelector("#state"); if(st) st.textContent=JSON.stringify(STATE);
  return "<!doctype html>\n"+c.outerHTML;
}
function commit(msg){
  render();
  try{ localStorage.setItem("ef-ledger",JSON.stringify(STATE)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!ARTIFACT){ toast(msg||"Saved on this device"); return; }
    ARTIFACT.publish(buildDoc()).then(function(){ toast(msg||"Saved"); })
      .catch(function(err){ if(err&&err.code==="conflict") return; toast("Saved on this device only"); });
  },700);
}
function toast(m){ NOTE=m; render(); clearTimeout(noteTimer); noteTimer=setTimeout(function(){ NOTE=""; render(); },2200); }

/* ---------- dom ---------- */
function h(tag,attrs,kids){
  const el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    const v=attrs[k]; if(v===null||v===undefined||v===false) return;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k==="html") el.innerHTML=v;
    else if(k==="style") el.setAttribute("style",v);
    else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?"":v);
  });
  (kids||[]).forEach(function(c){ if(c) el.appendChild(c); });
  return el;
}
function kstyle(k){ const x=KIND[k]||KIND.other; return "--k:var("+x.v+");--k-soft:var("+x.s+")"; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function shift(dir){

function cursor(){

/* ---------- blocks ---------- */
function evBlock(ev,opts){
  opts=opts||{};
  const meta=[];
  if(ev.group) meta.push(ev.group);
  if(ev.room) meta.push(ev.room);
  if(ev.with) meta.push("with "+ev.with);
  if(ev.by && !ev.mine) meta.push(ev.by);
  if(ev.by && ev.mine && ev.kind==="camp") meta.push(ev.by);
  if(ev.kind==="comp") meta.push(ev.pay>0 ? "flat fee for the whole competition" : "fee booked on the last day");
  if(ev.mine && !ev.onSheet) meta.push("billed direct");
  if(ev.cancelled) meta.push("cancelled");

  const main=h("div",{class:"ev-main"},[
    h("div",{class:"ev-time",text: ev.kind==="fee" ? "one-time fee"
      : ev.allDay ? ("all day · day "+ev.dayNo+" of "+ev.dayCount)
      : fmtRange(ev.s,ev.e)}),
    h("div",{class:"ev-title",text:ev.title}),
    meta.length?h("div",{class:"ev-meta",text:meta.join(" · ")}):null
  ]);
  if(opts.actions){
    const a=h("div",{class:"ev-actions"});
    if(ev.mine){
      a.appendChild(h("button",{class:"mini"+(ev.cancelled?"":" danger"),
        text:ev.cancelled?"Restore":"Cancel this date",onclick:function(){ toggleCancel(ev); }}));
      if(ev.pid) a.appendChild(h("button",{class:"mini",text:"Edit series",onclick:function(){ MODAL=addPrivateModal(ev.pid); render(); }}));
      if(STATE.claims[ev.id]) a.appendChild(h("button",{class:"mini",text:"Not mine",
        onclick:function(){ delete STATE.claims[ev.id]; commit("Removed from your hours"); }}));
    } else a.appendChild(h("button",{class:"mini",text:"+ Add to my hours",
      onclick:function(){ STATE.claims[ev.id]=true; commit("Added to your hours"); }}));
    main.appendChild(a);
  }
  return h("div",{class:"ev"+(ev.mine?"":" is-other")+(ev.cancelled?" is-cancelled":""),
    style:kstyle(ev.mine?ev.kind:"other")},[
    main, ev.mine&&!ev.cancelled ? h("div",{class:"ev-pay",text:money0(ev.pay)}) : null
  ]);
}
function toggleCancel(ev){
  if((STATE.overrides[ev.id]||{}).cancelled){ delete STATE.overrides[ev.id]; commit("Restored"); }
  else { STATE.overrides[ev.id]={cancelled:true}; commit("Cancelled for this date"); }
}

/* On a competition day, anything still on the schedule is probably not happening. */
function compClash(d){
  const all=mineOn(d).filter(function(e){ return !e.cancelled; });

    h("div",{class:"warn-banner"},[ h("div",{html:"&#9888;"}),
      h("div",{},[
        h("div",{html:"You are at <b>"+esc(comp.title)+"</b> this day, but "+clashing.length
          +" other "+(clashing.length===1?"booking is":"bookings are")+" still on the schedule: "

        h("button",{class:"mini",style:"margin-top:7px",

function legend(){

/* ================= competition planner =================
   Every routine Mark is down for, gathered from the schedule, so that when call
   times land (about a fortnight out) there is one place to put them. */
function routineList(){
  const seen={}, out=[];
  function add(title,type,where){
    if(!title) return;
    if(seen[title]){ if(where && seen[title].where.indexOf(where)<0) seen[title].where.push(where); return; }
    const r={key:title, title:title, type:type, where:where?[where]:[]};
    seen[title]=r; out.push(r);
  }
  WEEKLY.forEach(function(w){ if(w.mine && w.k==="company") add(w.t,"Company","Thursdays"); });
  ROTATIONS.forEach(function(r){ r.blocks.forEach(function(b){ if(b.mine) add(b.t,"Company",r.name); }); });
  PRESEASON.forEach(function(r){ if(/\bMark\b/.test(r[4])) add(r[3],"Company","Pre-season"); });
  STATE.privates.forEach(function(p){ add("Solo — "+p.student,"Solo","Private"); });
  out.sort(function(a,b){
    if(a.type!==b.type) return a.type==="Solo"?1:-1;
    return a.title.localeCompare(b.title);
  });
  return out;
}
function plannerFor(id){
  const p=STATE.planner[id]||(STATE.planner[id]={rows:{},extra:[]});
  if(!p.rows) p.rows={}; if(!p.extra) p.extra=[];
  return p;
}
function compEntries(cp){
  const p=plannerFor(cp.id);
  const list=routineList().concat(p.extra.map(function(e){
    return {key:e.key, title:e.title, type:e.type||"Company", where:["added by hand"], custom:true}; }));
  return list.map(function(r){
    const v=p.rows[r.key]||{};
    return {r:r, day:v.day||"", time:v.time||"", note:v.note||"", skip:!!v.skip};
  });
}
function compDays(cp){
  const a=fromYmd(cp.from), b=fromYmd(cp.to), out=[];
  for(let d=a; d<=b; d=addDays(d,1)) out.push(new Date(d));
  return out;
}
function setRow(cp,key,field,value){
  const p=plannerFor(cp.id);
  const row=p.rows[key]||(p.rows[key]={});
  row[field]=value;
  if(!row.day && !row.time && !row.note && !row.skip) delete p.rows[key];
}

function copyOrder(cp){
  const days=compDays(cp);
  const timed=compEntries(cp).filter(function(e){ return !e.skip && e.time; });
  let out=cp.name.toUpperCase()+" — "+cp.venue+"\n"+fmtDate(fromYmd(cp.from))+" – "+fmtDate(fromYmd(cp.to))+"\n";
  days.forEach(function(d){
    const on=timed.filter(function(e){ return e.day===ymd(d); })
                  .sort(function(x,y){ return x.time.localeCompare(y.time); });
    if(!on.length) return;
    out+="\n"+DOW_LONG[d.getDay()]+", "+fmtShort(d)+"\n";
    on.forEach(function(e){
      out+="  "+fmtTime(e.time).padStart(7," ")+"  "+e.r.title+(e.note?"  ("+e.note+")":"")+"\n";
    });
  });
  const done=function(){ toast("Running order copied"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(done).catch(function(){ legacyCopy(out,done); });
  } else legacyCopy(out,done);
}
function legacyCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy"); }
  ta.remove();
}

    const fY=h("select");
    [["Company","Company dance"],["Solo","Solo"]].forEach(function(o){
      fY.appendChild(h("option",{value:o[0],text:o[1]})); });
    return scrim(h("div",{class:"modal"},[
      h("div",{class:"modal-head"},[h("h2",{text:"Add a routine to "+cp.name}),closeBtn()]),
      h("div",{class:"modal-body"},[
        h("div",{class:"field"},[h("label",{text:"Routine"}),fT]),
        h("div",{class:"field"},[h("label",{text:"Type"}),fY]),
        h("div",{class:"hint",text:"This adds it to this competition only. Routines already in your schedule are listed automatically."})
      ]),
      h("div",{class:"modal-foot"},[
        h("button",{class:"btn",text:"Cancel",onclick:function(){ MODAL=null; render(); }}),
        h("button",{class:"btn btn-accent",text:"Add",onclick:function(){
          const title=fT.value.trim(); if(!title){ MODAL=null; render(); return; }
          const p=plannerFor(cp.id);
          if(!p.extra.some(function(x){ return x.key===title; }))
            p.extra.push({key:title,title:title,type:fY.value});
          MODAL=null; commit("Added "+title);
        }})])]));
  };
}

/* ---------- modals ---------- */
function scrim(inner){ return h("div",{class:"modal-scrim",
  onclick:function(e){ if(e.target===e.currentTarget){ MODAL=null; render(); } }},[inner]); }
function closeBtn(){ return h("button",{class:"iconbtn",html:"&times;","aria-label":"Close",
  onclick:function(){ MODAL=null; render(); }}); }

function addPrivateModal(editId){
  return function(){
    const ex = editId ? STATE.privates.filter(function(p){ return p.id===editId; })[0] : null;
    const p = ex || {student:"",start:"17:00",minutes:60,recurring:false,dow:2,nths:[],
      date:ymd(cursor()),from:ymd(cursor()),until:STATE.settings.seasonEnd,
      choreo:Number(STATE.settings.choreoFee)||0};
    const fS=h("input",{type:"text",value:p.student,placeholder:"e.g. Ava R."});
    const fL=h("select");
    [[30,"½ hour — "+money0(rateFor("private")/2)],[60,"1 hour — "+money0(rateFor("private"))],
     [45,"45 min — "+money0(rateFor("private")*.75)],[90,"1½ hours — "+money0(rateFor("private")*1.5)]]
      .forEach(function(o){ const x=h("option",{value:String(o[0]),text:o[1]}); if(Number(p.minutes)===o[0]) x.selected=true; fL.appendChild(x); });
    const fT=h("input",{type:"time",value:p.start});
    const fR=h("input",{type:"checkbox"}); fR.checked=!!p.recurring;
    const fD=h("select");
    [1,2,3,4,5,6,0].forEach(function(d){ const x=h("option",{value:String(d),text:DOW_LONG[d]}); if(Number(p.dow)===d) x.selected=true; fD.appendChild(x); });
    const fDate=h("input",{type:"date",value:p.date});
    const fFrom=h("input",{type:"date",value:p.from||STATE.settings.ledgerStart});
    const fUntil=h("input",{type:"date",value:p.until||STATE.settings.seasonEnd});
    const fC=h("input",{type:"number",step:"25",min:"0",value:String(p.choreo!=null?p.choreo:(Number(STATE.settings.choreoFee)||0))});
    const fN=h("select");
    [["","Every week"],["1,3,5","1st, 3rd & 5th of the month"],["2,4","2nd & 4th of the month"]]
      .forEach(function(o){ const x=h("option",{value:o[0],text:o[1]});
        if((p.nths||[]).join()===o[0]) x.selected=true; fN.appendChild(x); });
    const one=h("div",{class:"field"},[h("label",{text:"Date"}),fDate]);
    const rec=h("div",{style:"display:flex;flex-direction:column;gap:14px"},[
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Day"}),fD]),
        h("div",{class:"field"},[h("label",{text:"How often"}),fN])]),
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Starting"}),fFrom]),
        h("div",{class:"field"},[h("label",{text:"Through"}),fUntil])])]);
    function sync(){ one.style.display=fR.checked?"none":""; rec.style.display=fR.checked?"":"none"; }
    fR.addEventListener("change",sync);

    const foot=h("div",{class:"modal-foot"});
    if(ex) foot.appendChild(h("button",{class:"btn",text:"Delete series",onclick:function(){
      STATE.privates=STATE.privates.filter(function(x){ return x.id!==ex.id; }); MODAL=null; commit("Private lesson deleted"); }}));
    foot.appendChild(h("button",{class:"btn",text:"Cancel",onclick:function(){ MODAL=null; render(); }}));
    foot.appendChild(h("button",{class:"btn btn-accent",text:ex?"Save changes":"Add lesson",onclick:function(){
      const r={ id: ex?ex.id:"pv"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
        student:fS.value.trim()||"Private lesson", start:fT.value||"17:00", minutes:Number(fL.value),
        recurring:fR.checked, dow:Number(fD.value), date:fDate.value, from:fFrom.value, until:fUntil.value,
        nths: fN.value ? fN.value.split(",").map(Number) : [],
        choreo: Math.max(0, Number(fC.value)||0) };
      if(ex) STATE.privates=STATE.privates.map(function(x){ return x.id===r.id?r:x; }); else STATE.privates.push(r);
      MODAL=null; commit(ex?"Lesson updated":"Private lesson added"); }}));

    const m=h("div",{class:"modal"},[
      h("div",{class:"modal-head"},[h("h2",{text:ex?"Edit private lesson":"Add a private lesson"}),closeBtn()]),
      h("div",{class:"modal-body"},[
        h("div",{class:"field"},[h("label",{text:"Student"}),fS]),
        h("div",{class:"field-row"},[
          h("div",{class:"field"},[h("label",{text:"Start time"}),fT]),
          h("div",{class:"field"},[h("label",{text:"Length"}),fL])]),
        h("label",{class:"check"},[fR,h("span",{text:"Repeats"})]),
        one, rec,
        h("div",{class:"field"},[h("label",{text:"Choreography fee for the year"}),fC]),
        h("div",{class:"hint",text:"Charged once for the whole year, on this student's first lesson — every lesson after that is just the hourly rate. Set it to 0 if they don't need choreography."}),
        h("div",{class:"hint",text:"Privates bill at "+money0(rateFor("private"))+"/hr and stay off the studio timesheet. Cancel any single date later from the Day view without touching the series."})
      ]), foot]);
    setTimeout(sync,0);
    return scrim(m);
  };
}
function privatesModal(){
  const list=h("div",{class:"plist"});
  if(!STATE.privates.length) list.appendChild(h("div",{class:"hint",text:"No private lessons yet. Add one and it shows on the calendar and in payroll — tracked separately from your timesheet."}));
  STATE.privates.forEach(function(p){
    const len=(p.minutes/60===.5?"½":String(p.minutes/60))+"h";
    const cadence=(p.nths&&p.nths.length)
      ? (p.nths.join("/")+" "+DOW_LONG[Number(p.dow)]+"s")
      : ("Every "+DOW_LONG[Number(p.dow)]);
    const when=p.recurring?(cadence+" · "+fmtTime(p.start)+" · "+len)
      :(fmtDate(fromYmd(p.date))+" · "+fmtTime(p.start)+" · "+len);
    const fee=Number(p.choreo)||0;
    const first=firstLessonOf(p);
    list.appendChild(h("div",{class:"prow",style:kstyle("private")},[h("span",{class:"dot"}),
      h("div",{class:"pn"},[h("b",{text:p.student}),
        h("div",{text:when+" · "+money0(p.minutes/60*rateFor("private"))+"/lesson"}),
        fee?h("div",{text:"+ "+money0(fee)+" choreo, once"+(first?" on "+fmtDate(fromYmd(first)):"")}):null]),
      h("button",{class:"mini",text:"Edit",onclick:function(){ MODAL=addPrivateModal(p.id); render(); }})]));
  });
  return scrim(h("div",{class:"modal"},[
    h("div",{class:"modal-head"},[h("h2",{text:"Private lessons"}),closeBtn()]),
    h("div",{class:"modal-body"},[list]),
    h("div",{class:"modal-foot"},[h("button",{class:"btn btn-accent",text:"+ Add lesson",
      onclick:function(){ MODAL=addPrivateModal(null); render(); }})])]));
}
function settingsModal(){
  const s=STATE.settings;
  const fL=h("input",{type:"date",value:s.ledgerStart});
  const fS=h("input",{type:"date",value:s.seasonStart});
  const fE=h("input",{type:"date",value:s.seasonEnd});
  const fC=h("input",{type:"number",step:"0.5",value:String(s.rateClass)});
  const fO=h("input",{type:"number",step:"0.5",value:String(s.rateOffice)});
  const fP=h("input",{type:"number",step:"0.5",value:String(s.ratePrivate)});
  const fF=h("input",{type:"number",step:"25",min:"0",value:String(s.choreoFee!=null?s.choreoFee:200)});
  const fLE=h("input",{type:"date",value:s.ledgerEnd||s.seasonEnd});
  const fCF=h("input",{type:"number",step:"25",min:"0",value:String(s.compFee!=null?s.compFee:250)});
  return scrim(h("div",{class:"modal"},[
    h("div",{class:"modal-head"},[h("h2",{text:"Season, timesheets & rates"}),closeBtn()]),
    h("div",{class:"modal-body"},[
      h("div",{class:"field"},[h("label",{text:"Pay period 1 starts"}),fL]),
      h("div",{class:"hint",text:"Periods are 14 days and each one ends on a timesheet Sunday. Starting Aug 17, 2026 puts the first deadline on Sunday Aug 30."}),
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Weekly classes begin"}),fS]),
        h("div",{class:"field"},[h("label",{text:"Weekly classes end"}),fE])]),
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Ledger runs through"}),fLE]),
        h("div",{class:"field"},[h("label",{text:"Competition fee"}),fCF])]),
      h("div",{class:"hint",text:"Pay periods carry on to the ledger end date, so July competitions are still counted after classes finish. Each competition pays one flat fee however many days it runs."}),
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Class rate /hr"}),fC]),
        h("div",{class:"field"},[h("label",{text:"Office rate /hr"}),fO])]),
      h("div",{class:"field-row"},[
        h("div",{class:"field"},[h("label",{text:"Private lesson rate /hr"}),fP]),
        h("div",{class:"field"},[h("label",{text:"Choreo fee per student/yr"}),fF])]),
      h("div",{class:"hint",text:"Half-hour privates bill at half the hourly rate. The choreo fee is a flat charge each private student pays once for the year — this sets the default for new ones."})
    ]),
    h("div",{class:"modal-foot"},[
      h("button",{class:"btn",text:"Cancel",onclick:function(){ MODAL=null; render(); }}),
      h("button",{class:"btn btn-accent",text:"Save",onclick:function(){
        s.ledgerStart=fL.value||s.ledgerStart; s.seasonStart=fS.value||s.seasonStart; s.seasonEnd=fE.value||s.seasonEnd;
        s.rateClass=Number(fC.value)||40; s.rateOffice=Number(fO.value)||40; s.ratePrivate=Number(fP.value)||65;
        s.choreoFee=Math.max(0,Number(fF.value)||0);
        s.ledgerEnd=fLE.value||s.ledgerEnd; s.compFee=Math.max(0,Number(fCF.value)||0);
        MODAL=null; commit("Settings saved"); }})])]));
}
function footer(){
  return h("div",{class:"foot"},[
    h("span",{text:"Timesheet every 2nd Sunday · privates excluded"}),
    h("span",{text:"Pre-season camp Aug 24 – Sep 12"}),
    h("span",{text:"Weekly classes from Sep 14"}),
    h("span",{text:"4 competitions · $250 each"}),
    h("span",{text:"Company 1 · 2nd & 4th Fri"}),
    h("span",{text:"Company 2 · 1st, 3rd & 5th Fri"}),
    h("span",{text:"Company 3 · 1st, 3rd & 5th Sat"})
  ]);
}

render();
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){ ARTIFACT=a; }).catch(function(){});
}
})();
</script>
