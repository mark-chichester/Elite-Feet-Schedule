<body>
<title>Mark's Teaching Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#F1F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --surface-3:#EDF1F5;
  --line:#DEE4EA; --line-strong:#C6CED8;
  --ink:#12161C; --ink-2:#525B67; --ink-3:#838C98;
  --accent:#0078BF; --accent-ink:#FFFFFF; --accent-soft:#E2F0F9;
  --c-class:#0078BF; --c-class-soft:#E2F0F9;
  --c-company:#D02A38; --c-company-soft:#FCE7E8;
  --c-camp:#7A4FBF; --c-camp-soft:#EFE8FA;
  --c-private:#D9701C; --c-private-soft:#FDEEE0;
  --c-comp:#0E7C86; --c-comp-soft:#DFF1F3;
  --c-other:#98A2AE; --c-other-soft:#EEF1F4;
  --shadow:0 1px 2px rgba(18,22,28,.06), 0 8px 24px -12px rgba(18,22,28,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1116; --surface:#171B22; --surface-2:#1D222A; --surface-3:#232933;
    --line:#2A313B; --line-strong:#3A424E;
    --ink:#EDF1F6; --ink-2:#A4AEBB; --ink-3:#78828F;
    --accent:#46A8E8; --accent-ink:#06202F; --accent-soft:#132A3A;
    --c-class:#46A8E8; --c-class-soft:#13293A;
    --c-company:#F26A73; --c-company-soft:#331A1E;
    --c-camp:#A98BE0; --c-camp-soft:#241D33;
    --c-private:#F0994A; --c-private-soft:#332414;
    --c-comp:#4FC2CE; --c-comp-soft:#102E31;
    --c-other:#7C8794; --c-other-soft:#20262E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1116; --surface:#171B22; --surface-2:#1D222A; --surface-3:#232933;
  --line:#2A313B; --line-strong:#3A424E;
  --ink:#EDF1F6; --ink-2:#A4AEBB; --ink-3:#78828F;
  --accent:#46A8E8; --accent-ink:#06202F; --accent-soft:#132A3A;
  --c-class:#46A8E8; --c-class-soft:#13293A;
  --c-company:#F26A73; --c-company-soft:#331A1E;
  --c-camp:#A98BE0; --c-camp-soft:#241D33;
  --c-private:#F0994A; --c-private-soft:#332414;
  --c-comp:#4FC2CE; --c-comp-soft:#102E31;
  --c-other:#7C8794; --c-other-soft:#20262E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:Archivo,"Public Sans",sans-serif;margin:0;text-wrap:balance}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:48px;height:48px;flex:none;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 1px var(--line)}
.brand-mark img{width:100%;height:100%;display:block}
.brand-eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brand-name{font-family:Archivo;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.brand-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.spacer{flex:1}

.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 14px}
.tabs{display:flex;background:var(--surface-3);border-radius:var(--radius);padding:3px;gap:2px}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav{display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.btn:hover{border-color:var(--line-strong);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.range-title{font-family:Archivo;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

.ev{display:flex;gap:10px;align-items:flex-start;position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px 9px 13px;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
.ev-main{min-width:0;flex:1}
.ev-time{font-family:"IBM Plex Mono";font-size:11px;font-weight:500;color:var(--ink-3);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev-title{font-weight:600;font-size:13.5px;line-height:1.3;margin-top:1px}
.ev-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.ev.is-other{background:var(--surface-2);border-style:dashed}
.ev.is-other .ev-title{color:var(--ink-2);font-weight:500}
.ev.is-comp{background:var(--k-soft);border-color:var(--k)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--k);flex:none}

.day-head{padding:17px 19px;border-bottom:1px solid var(--line)}
.day-dow{font-family:Archivo;font-size:23px;font-weight:800;letter-spacing:-.02em}
.day-date{font-size:13px;color:var(--ink-3);margin-top:1px}
.day-list{padding:15px 19px;display:flex;flex-direction:column;gap:8px}
.day-list .ev{padding:12px 13px 12px 16px}
.day-list .ev-title{font-size:15px}
.day-list .ev-time{font-size:12px}

.week-scroll{overflow-x:auto;padding-bottom:4px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(146px,1fr));gap:10px;min-width:1082px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.wcol.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wcol-head{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:baseline;gap:6px;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;cursor:pointer}
.wcol-dow{font-family:Archivo;font-weight:700;font-size:12px;letter-spacing:.02em}
.wcol-num{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wcol-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:60px}
.wempty{font-size:11.5px;color:var(--ink-3);padding:6px 2px;font-style:italic}

.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mdow{background:var(--surface-2);padding:7px 9px;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3);text-align:center}
.mcell{background:var(--surface);min-height:104px;padding:7px 8px;display:flex;flex-direction:column;
  gap:5px;text-align:left;border:0;border-radius:0}
.mcell:hover{background:var(--surface-2)}
.mcell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mcell.is-out{background:var(--surface-2);opacity:.5}
.mcell.is-today .mnum{background:var(--accent);color:var(--accent-ink)}
.mnum{font-family:"IBM Plex Mono";font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  width:21px;height:21px;display:grid;place-items:center;border-radius:50%}
.mdots{display:flex;flex-wrap:wrap;gap:3px}
.mchip{font-size:10px;font-weight:600;border-radius:4px;padding:1px 5px;background:var(--k-soft);
  color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mdot-only{width:6px;height:6px;border-radius:50%;background:var(--k);display:none}

.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:8px;
  background:var(--k-soft);border:1px solid var(--k);color:var(--k);font-size:13px;font-weight:600;margin:0 19px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2);padding:16px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-size:16px;color:var(--ink-2);margin-bottom:5px}
.empty p{font-size:13.5px;margin:0}
.foot{padding:24px 0 0;font-size:11.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;align-items:center}

@media(max-width:720px){
  .mcell{min-height:74px}
  .mchip{display:none}
  .mdot-only{display:block}
  .mdots{gap:4px}
}
@media(max-width:560px){
  .tabs{flex-wrap:wrap}
  .tab{padding:7px 13px;font-size:13px}
  .brand-mark{width:42px;height:42px}
}

@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000;font-size:11px}
  .topbar{position:static;border-bottom:2px solid #000}
  .toolbar,.nav,.tabs,.btn,.iconbtn,.legend{display:none !important}
  .wrap{padding:0;max-width:none}
  .week-scroll{overflow:visible}
  .week-grid{min-width:0;grid-template-columns:repeat(7,1fr);gap:4px}
  .card,.wcol,.ev{box-shadow:none;break-inside:avoid}
  .ev{padding:5px 6px 5px 8px}
  .ev-title{font-size:10.5px}
  .ev-time{font-size:9px}
  .ev-meta{font-size:8.5px}
  .print-only{display:block !important}
}
.print-only{display:none}
</style>

const PRE_BY_DATE = {};
PRESEASON.forEach(function(r,i){ (PRE_BY_DATE[r[0]] = PRE_BY_DATE[r[0]] || []).push({
  id:"ps"+i, s:r[1], e:r[2], t:r[3], by:r[4], room:r[5], mine:/\bMark\b/.test(r[4])
}); });

const COMPETITIONS = [
  {id:"cmp-rev",  name:"Revolution",        venue:"Gordon Center, Owings Mills MD", from:"2027-03-12", to:"2027-03-14"},
  {id:"cmp-img",  name:"Imagine",           venue:"Jim Rouse, Columbia MD",         from:"2027-04-23", to:"2027-04-25"},
  {id:"cmp-nex",  name:"NexStar",           venue:"Gordon Center, Owings Mills MD", from:"2027-05-14", to:"2027-05-16"},
  {id:"cmp-natl", name:"Imagine Nationals", venue:"Ocean City, MD",                 from:"2027-07-04", to:"2027-07-08"}
];

/* Standing private lessons. Names are deliberately left out — this copy is for sharing. */
const PRIVATES = [
  {start:"07:15", minutes:45, dow:6, nths:[1,3,5], from:"2026-09-14", until:"2027-06-26"},
  {start:"11:00", minutes:60, dow:0, nths:[1,3,5], from:"2026-09-14", until:"2027-06-26"}
];

const SEASON = {
  scheduleStart:"2026-08-24",   /* first day of pre-season camp */
  classesStart:"2026-09-14",    /* weekly classes begin */
  classesEnd:"2027-06-26",      /* weekly classes stop */
  scheduleEnd:"2027-07-08"      /* last day of the last competition */
};

const KIND = {
  class:   {label:"Class",      v:"--c-class",   s:"--c-class-soft"},
  company: {label:"Company",    v:"--c-company", s:"--c-company-soft"},
  camp:    {label:"Pre-season", v:"--c-camp",    s:"--c-camp-soft"},
  private: {label:"Private",    v:"--c-private", s:"--c-private-soft"},
  comp:    {label:"Competition",v:"--c-comp",    s:"--c-comp-soft"},
  other:   {label:"Other staff",v:"--c-other",   s:"--c-other-soft"}
};

let VIEW="week", CURSOR=null, SHOW_OTHERS=false;

/* ---------- dates ---------- */
const DOW_LONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ return addDays(d,-((d.getDay()+6)%7)); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function nthOfMonth(d){ return Math.floor((d.getDate()-1)/7)+1; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function sameDay(a,b){ return ymd(a)===ymd(b); }
function mins(t){ const p=t.split(":").map(Number); return p[0]*60+p[1]; }
function fmtTime(t){ const p=t.split(":").map(Number),h=p[0],m=p[1];
  return (h%12===0?12:h%12)+(m?":"+String(m).padStart(2,"0"):"")+(h>=12?"pm":"am"); }
function fmtRange(s,e){ const a=fmtTime(s),b=fmtTime(e);
  return (a.slice(-2)===b.slice(-2)?a.slice(0,-2):a)+"–"+b; }
function fmtDate(d){ return MON_SHORT[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }
function fmtShort(d){ return MON_SHORT[d.getMonth()]+" "+d.getDate(); }
function endFrom(start,minutes){ const t=mins(start)+Number(minutes);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }

function inSchedule(d){ return d>=fromYmd(SEASON.scheduleStart) && d<=fromYmd(SEASON.scheduleEnd); }
function inClasses(d){ return d>=fromYmd(SEASON.classesStart) && d<=fromYmd(SEASON.classesEnd); }

/* ---------- what is on ---------- */
function mk(date,s,e,title,kind,mine,wth,by,group,room){
  return {date:date,s:s,e:e,title:title,kind:kind,mine:!!mine,
          with:wth||null,by:by||null,group:group||null,room:room||null,allDay:false};
}
function eventsOn(d){
  const key=ymd(d), out=[];
  if(!inSchedule(d)) return out;
  const dow=d.getDay(), nth=nthOfMonth(d);

  (PRE_BY_DATE[key]||[]).forEach(function(b){
    out.push(mk(key,b.s,b.e,b.t,"camp",b.mine,null,b.by||null,"Pre-season camp",b.room));
  });

  if(inClasses(d)){
    WEEKLY.forEach(function(w){
      if(w.dow!==dow) return;
      if(w.k==="office") return;                       /* admin time is not a class */
      out.push(mk(key,w.s,w.e,w.t,w.k,w.mine,w.with,w.by,null,null));
    });
    ROTATIONS.forEach(function(r){
      if(r.dow!==dow || r.nth.indexOf(nth)<0) return;
      r.blocks.forEach(function(b){
        out.push(mk(key,b.s,b.e,b.t,"company",b.mine,b.with,b.by,r.name,null));
      });
    });
  }

  PRIVATES.forEach(function(p){
    const from=fromYmd(p.from), until=fromYmd(p.until);
    if(Number(p.dow)!==dow || d<from || d>until) return;
    if(p.nths && p.nths.length && p.nths.indexOf(nth)<0) return;
    out.push(mk(key,p.start,endFrom(p.start,p.minutes),"Private lesson","private",true,null,null,null,null));
  });

  COMPETITIONS.forEach(function(cp){
    const a=fromYmd(cp.from), b=fromYmd(cp.to);
    if(d<a || d>b) return;
    const ev=mk(key,"00:00","00:00",cp.name,"comp",true,null,null,null,cp.venue);
    ev.allDay=true; ev.dayNo=daysBetween(a,d)+1; ev.dayCount=daysBetween(a,b)+1;
    out.push(ev);
  });

  out.sort(function(a,b){ return mins(a.s)-mins(b.s) || a.title.localeCompare(b.title); });
  return out;
}
function shown(d){
  return eventsOn(d).filter(function(e){ return SHOW_OTHERS || e.mine; });
}
function compOn(d){
  return eventsOn(d).filter(function(e){ return e.kind==="comp"; })[0] || null;
}

/* ---------- dom ---------- */
function h(tag,attrs,kids){
  const el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    const v=attrs[k]; if(v===null||v===undefined||v===false) return;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k==="html") el.innerHTML=v;
    else if(k==="style") el.setAttribute("style",v);
    else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?"":v);
  });
  (kids||[]).forEach(function(c){ if(c) el.appendChild(c); });
  return el;
}
function kstyle(k){ const x=KIND[k]||KIND.other; return "--k:var("+x.v+");--k-soft:var("+x.s+")"; }

const root=document.getElementById("app");

function render(){
  root.innerHTML="";
  root.appendChild(topbar());
  const w=h("div",{class:"wrap"});
  w.appendChild(toolbar());
  if(VIEW==="day") w.appendChild(dayView());
  if(VIEW==="week") w.appendChild(weekView());
  if(VIEW==="month") w.appendChild(monthView());
  w.appendChild(legend());
  w.appendChild(footer());
  root.appendChild(w);
}

function topbar(){
  return h("header",{class:"topbar"},[ h("div",{class:"topbar-in"},[
    h("div",{class:"brand"},[
      h("div",{class:"brand-mark"},[h("img",{src:LOGO,alt:"Elite Feet Dance Studio"})]),
      h("div",{},[
        h("div",{class:"brand-eyebrow",text:"Elite Feet Dance Studio"}),
        h("div",{class:"brand-name",text:"Mark's Teaching Schedule"}),
        h("div",{class:"brand-sub",text:"2026–27 season · pre-season camp through Nationals"})
      ])
    ]),
    h("div",{class:"spacer"}),
    h("div",{class:"print-only",style:"font-size:12px;color:var(--ink-3)"})
  ])]);
}

function toolbar(){
  const tabs=h("div",{class:"tabs",role:"tablist"});
  [["day","Day"],["week","Week"],["month","Month"]].forEach(function(p){
    tabs.appendChild(h("button",{class:"tab",role:"tab","aria-selected":VIEW===p[0]?"true":"false",text:p[1],
      onclick:function(){ VIEW=p[0]; render(); }}));
  });
  return h("div",{class:"toolbar"},[
    tabs,
    h("div",{class:"nav"},[
      h("button",{class:"iconbtn","aria-label":"Previous",html:"&#8249;",onclick:function(){ shift(-1); }}),
      h("button",{class:"iconbtn","aria-label":"Next",html:"&#8250;",onclick:function(){ shift(1); }}),
      h("button",{class:"btn",text:"Today",onclick:function(){ CURSOR=today(); render(); }})
    ]),
    h("div",{class:"range-title",text:rangeLabel()}),
    h("div",{class:"spacer"}),
    h("button",{class:"btn",text:SHOW_OTHERS?"Hide studio-wide":"Show studio-wide",
      onclick:function(){ SHOW_OTHERS=!SHOW_OTHERS; render(); }}),
    h("button",{class:"btn",text:"Print",onclick:function(){ window.print(); }})
  ]);
}
function shift(dir){
  const c=cursor();
  if(VIEW==="day") CURSOR=addDays(c,dir);
  if(VIEW==="week") CURSOR=addDays(c,dir*7);
  if(VIEW==="month") CURSOR=new Date(c.getFullYear(),c.getMonth()+dir,1);
  render();
}
function cursor(){
  if(!CURSOR){ const t=today(), a=fromYmd(SEASON.scheduleStart); CURSOR = t<a ? a : t; }
  return CURSOR;
}
function rangeLabel(){
  const c=cursor();
  if(VIEW==="day") return DOW_LONG[c.getDay()]+", "+MON_LONG[c.getMonth()]+" "+c.getDate();
  if(VIEW==="week"){
    const m=mondayOf(c), s=addDays(m,6);
    return m.getMonth()===s.getMonth()
      ? MON_LONG[m.getMonth()]+" "+m.getDate()+"–"+s.getDate()+", "+s.getFullYear()
      : fmtShort(m)+" – "+fmtShort(s)+", "+s.getFullYear();
  }
  return MON_LONG[c.getMonth()]+" "+c.getFullYear();
}

function evBlock(ev){
  const meta=[];
  if(ev.group) meta.push(ev.group);
  if(ev.room) meta.push(ev.room);
  if(ev.with) meta.push("with "+ev.with);
  if(ev.by && !ev.mine) meta.push(ev.by);
  if(ev.by && ev.mine && ev.kind==="camp") meta.push(ev.by);
  return h("div",{class:"ev"+(ev.mine?"":" is-other")+(ev.kind==="comp"?" is-comp":""),
    style:kstyle(ev.mine?ev.kind:"other")},[
    h("div",{class:"ev-main"},[
      h("div",{class:"ev-time",text: ev.allDay ? ("all day · day "+ev.dayNo+" of "+ev.dayCount) : fmtRange(ev.s,ev.e)}),
      h("div",{class:"ev-title",text:ev.title}),
      meta.length?h("div",{class:"ev-meta",text:meta.join(" · ")}):null
    ])
  ]);
}

/* ---------- day ---------- */
function dayView(){
  const d=cursor(), list=shown(d), cp=compOn(d);
  const body=h("div",{class:"day-list"});
  if(!inSchedule(d)) body.appendChild(offSeason(d));
  else if(!list.length) body.appendChild(h("div",{class:"empty"},[
    h("h3",{text:"Nothing scheduled"}),
    h("p",{text:"No classes or rehearsals this day."})]));
  else list.forEach(function(e){ if(e.kind!=="comp") body.appendChild(evBlock(e)); });

  return h("section",{class:"card"},[
    h("div",{class:"day-head"},[
      h("div",{class:"day-dow",text:DOW_LONG[d.getDay()]}),
      h("div",{class:"day-date",text:MON_LONG[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()
        +(sameDay(d,today())?" · today":"")})
    ]),
    cp?h("div",{style:"padding:14px 0 0"},[
      h("div",{class:"banner",style:kstyle("comp")},[h("span",{class:"dot"}),
        h("span",{text:"At "+cp.title+" — "+cp.room+" (day "+cp.dayNo+" of "+cp.dayCount+")"})])]):null,
    body
  ]);
}
function offSeason(d){
  const a=fromYmd(SEASON.scheduleStart);
  return h("div",{class:"empty"},[
    h("h3",{text: d<a ? "Before the season starts" : "After the season ends"}),
    h("p",{text:"This schedule covers "+fmtDate(a)+" through "+fmtDate(fromYmd(SEASON.scheduleEnd))+"."})]);
}

/* ---------- week ---------- */
function weekView(){
  const m=mondayOf(cursor()), days=[];
  for(let i=0;i<7;i++) days.push(addDays(m,i));
  const grid=h("div",{class:"week-grid"});
  days.forEach(function(d){
    const list=shown(d), body=h("div",{class:"wcol-body"});
    if(!list.length) body.appendChild(h("div",{class:"wempty",text:inSchedule(d)?"—":"off season"}));
    else list.forEach(function(e){
      const b=evBlock(e); b.style.cursor="pointer";
      b.addEventListener("click",function(){ CURSOR=d; VIEW="day"; render(); });
      body.appendChild(b);
    });
    grid.appendChild(h("div",{class:"wcol"+(sameDay(d,today())?" is-today":"")},[
      h("button",{class:"wcol-head",onclick:function(){ CURSOR=d; VIEW="day"; render(); }},[
        h("span",{class:"wcol-dow",text:DOW_SHORT[d.getDay()]}),
        h("span",{class:"wcol-num",text:fmtShort(d)})]),
      body
    ]));
  });
  return h("div",{class:"week-scroll"},[grid]);
}

/* ---------- month ---------- */
function monthView(){
  const c=cursor(), first=new Date(c.getFullYear(),c.getMonth(),1), start=mondayOf(first);
  const grid=h("div",{class:"mgrid"});
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(x){ grid.appendChild(h("div",{class:"mdow",text:x})); });
  for(let i=0;i<42;i++){
    const d=addDays(start,i), out=d.getMonth()!==c.getMonth();
    const evs=shown(d), dots=h("div",{class:"mdots"}), by={};
    evs.forEach(function(e){ const k=e.mine?e.kind:"other"; by[k]=(by[k]||0)+1; });
    Object.keys(by).forEach(function(k){
      dots.appendChild(h("span",{class:"mchip",style:kstyle(k),
        text: k==="comp" ? KIND[k].label : KIND[k].label+" ×"+by[k]}));
      dots.appendChild(h("span",{class:"mdot-only",style:kstyle(k)}));
    });
    grid.appendChild(h("button",{
      class:"mcell"+(out?" is-out":"")+(sameDay(d,today())?" is-today":""),
      onclick:function(){ CURSOR=d; VIEW="day"; render(); },
      "aria-label":fmtDate(d)
    },[
      h("div",{style:"display:flex;justify-content:space-between;align-items:center"},[
        h("span",{class:"mnum",text:String(d.getDate())})]),
      dots
    ]));
    if(i>=34 && addDays(start,i+1).getMonth()!==c.getMonth()) break;
  }
  return grid;
}

function legend(){
  const l=h("div",{class:"legend"});
  ["class","company","camp","private","comp"].forEach(function(k){
    l.appendChild(h("span",{style:kstyle(k)},[h("span",{class:"dot"}),h("span",{text:KIND[k].label})]));
  });
  if(SHOW_OTHERS) l.appendChild(h("span",{style:kstyle("other")},[h("span",{class:"dot"}),
    h("span",{text:"Other faculty"})]));
  return l;
}
function footer(){
  return h("div",{class:"foot"},[
    h("span",{text:"Pre-season camp Aug 24 – Sep 12"}),
    h("span",{text:"Weekly classes from Sep 14"}),
    h("span",{text:"Company 1 · 2nd & 4th Fri"}),
    h("span",{text:"Company 2 · 1st, 3rd & 5th Fri"}),
    h("span",{text:"Company 3 · 1st, 3rd & 5th Sat"})
  ]);
}

render();
